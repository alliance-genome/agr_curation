name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Only run on pull requests and PR comments (not issue comments)
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # REQUIRED: Must grant id-token permission to the reusable workflow
      id-token: write
    uses: alliance-genome/.github/.github/workflows/claude-code-review.yml@main
    with:
      model: claude-sonnet-4-20250514
      max_turns: "60"
      # Java/Quarkus backend with Hibernate and complex biological data model
      review_focus: "critical bugs, database performance issues, and data integrity problems in the Java Quarkus backend. Focus on: Hibernate N+1 queries, missing @Transactional boundaries, inefficient JPA queries, database migration risks, improper entity relationships, missing indexes, bulk operation performance, and biological data validation errors"
      trigger_phrase: "@claude"
      use_zen_tools: true
      pr_size_threshold: "300"
      skip_threshold: "25"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}