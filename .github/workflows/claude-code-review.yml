name: Claude Code Review

on:
  pull_request:
    types: [opened]
    branches:
      - alpha
  issue_comment:
    types: [created]

jobs:
  authorize:
    if: |
      github.actor != 'pjhale' &&
      github.actor != 'claude[bot]' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      review-sha: ${{ steps.verify.outputs.result }}
    steps:
      - name: Verify repository permission and PR source
        id: verify
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          result-encoding: string
          script: |
            const repo = context.repo;
            const actors = new Set([context.actor, process.env.GITHUB_TRIGGERING_ACTOR]);
            for (const username of actors) {
              if (!username) return '';
              const {data} = await github.rest.repos.getCollaboratorPermissionLevel({...repo, username});
              if (!['admin', 'write', 'maintain'].includes(data.permission)) {
                core.notice('Review skipped because the requester lacks write access.');
                return '';
              }
            }
            const pr = context.eventName === 'pull_request' ? context.payload.pull_request :
              (await github.rest.pulls.get({...repo, pull_number: context.issue.number})).data;
            if (pr.state !== 'open' || pr.head.repo?.id !== context.payload.repository.id) {
              core.notice('Privileged reviews require an open PR from this repository.');
              return '';
            }
            // PR events provide a merge SHA. For comments, pin the current PR head.
            const sha = context.eventName === 'pull_request' ? context.sha : pr.head.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('GitHub did not provide a valid commit for this PR.');
              return '';
            }
            return sha;

  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    needs: authorize
    if: needs.authorize.outputs.review-sha != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.authorize.outputs.review-sha }}

      - name: Calculate PR size and skip trivial changes
        id: pr_size
        if: github.event_name == 'pull_request'
        run: |
          set -eo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          DIFF_STATS=$(git diff --numstat "$BASE_SHA".."$HEAD_SHA" | grep -E '^[0-9]+\s+[0-9]+' || true)
          TOTAL=$(echo "$DIFF_STATS" | awk '{s+=$1+$2} END {print s+0}')
          echo "total_changes=$TOTAL" >> $GITHUB_OUTPUT
          if (( 10#${TOTAL:-0} <= 3 )); then
            echo "skip_review=true" >> $GITHUB_OUTPUT
          else
            echo "skip_review=false" >> $GITHUB_OUTPUT
          fi

      - name: Post skip message
        if: github.event_name == 'pull_request' && steps.pr_size.outputs.skip_review == 'true'
        uses: actions/github-script@main
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Claude Code Review Skipped** — only **${{ steps.pr_size.outputs.total_changes }}** lines changed (<= 3). Comment \`@claude review my changes\` to request one.`
            })

      # Install Claude Code ourselves instead of using the version bundled with the
      # action, which can lag behind new models (e.g. claude-opus-5-5 needs >= 2.1.280).
      # CLAUDE_CODE_VERSION org/repo variable: latest | stable | exact version (e.g. 2.1.280).
      # To roll back a bad Claude Code release, set it to the last known-good version.
      - name: Install Claude Code
        id: claude_install
        if: github.event_name == 'issue_comment' || steps.pr_size.outputs.skip_review != 'true'
        run: |
          set -eo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s -- "${{ vars.CLAUDE_CODE_VERSION || 'latest' }}"
          "$HOME/.local/bin/claude" --version
          echo "path=$HOME/.local/bin/claude" >> "$GITHUB_OUTPUT"

      # Auto-review on pull_request events.
      # Per official docs: provide REPO, PR NUMBER, gh pr comment instruction, and --allowedTools.
      - name: Claude Code Review (auto-review)
        uses: anthropics/claude-code-action@main
        if: github.event_name == 'pull_request' && steps.pr_size.outputs.skip_review != 'true'
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ steps.claude_install.outputs.path }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            START by running: gh pr diff ${{ github.event.pull_request.number }} --name-only
            Examine what types of files changed (code, config, docs, migrations, etc.).
            Then read the full diff: gh pr diff ${{ github.event.pull_request.number }}

            If the repo contains a CLAUDE.md file, read it first for project context.
            If the repo contains a REVIEW.md file, follow its review guidelines.

            Scope your review to the types of files that actually changed.
            Focus on correctness, bugs, security, and database performance.
            Only flag issues introduced by the changes, not pre-existing code.
            If the changes look correct, say so briefly. Do NOT invent issues.
            Do NOT pad reviews with trivial suggestions or stylistic preferences.

            Review database changes using versioned migrations, schemas, queries, and tests.

            Use `gh pr comment` for top-level feedback.
            Only post GitHub comments — do not submit review text as messages.

          claude_args: |
            --model ${{ vars.CLAUDE_PR_REVIEW_MODEL }}
            --max-turns 60
            --max-budget-usd 5.00
            --permission-mode bypassPermissions
            --disallowedTools "WebFetch,WebSearch,Edit,Write,NotebookEdit,Bash(curl:*),Bash(wget:*),Bash(nc:*),Bash(ssh:*),Bash(scp:*),Bash(rsync:*),Bash(gh pr close:*),Bash(gh pr edit:*),Bash(gh pr review:*),Bash(gh api:*),Bash(env),Bash(printenv:*),Bash(sudo:*)"

      # Interactive mode: respond to @claude mentions on PRs.
      # Per official docs: no prompt, no --allowedTools — action auto-detects tag mode.
      - name: Claude Code Review (interactive)
        uses: anthropics/claude-code-action@main
        if: github.event_name == 'issue_comment'
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ steps.claude_install.outputs.path }}
          trigger_phrase: "@claude"
          # Same blocklist applies to @claude interactive mentions.
          claude_args: |
            --model ${{ vars.CLAUDE_PR_REVIEW_MODEL }}
            --max-turns 60
            --max-budget-usd 5.00
            --permission-mode bypassPermissions
            --disallowedTools "WebFetch,WebSearch,Edit,Write,NotebookEdit,Bash(curl:*),Bash(wget:*),Bash(nc:*),Bash(ssh:*),Bash(scp:*),Bash(rsync:*),Bash(gh pr close:*),Bash(gh pr edit:*),Bash(gh pr review:*),Bash(gh api:*),Bash(env),Bash(printenv:*),Bash(sudo:*)"
            --append-system-prompt "When re-reviewing a PR after being asked to check again, ALWAYS run git log --oneline to check if new commits were pushed since your previous review. Read through all PR comments to find your earlier review(s) and note when they were posted. If new commits were pushed after your previous review, check whether those commits addressed the feedback from your earlier review. Frame your updated review accordingly — for example, note which issues from your earlier review have been addressed by the new commit(s) and which (if any) remain. Do NOT retract or call previous reviews inaccurate when subsequent commits fixed the issues that were flagged."
